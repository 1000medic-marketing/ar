<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>Experiência WebXR</title>

  <!-- Three.js and GLTFLoader -->
  <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
  <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    body { margin: 0; }
    canvas { display: block; }
    #exitButton {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background-color: rgba(255, 0, 0, 0.7); /* Vermelho semi-transparente */
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      z-index: 1000; /* Garante que o botão fique na frente do canvas */
    }
    #exitButton:hover {
      background-color: rgba(255, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <button onclick="activateXR()">Iniciar experiência WebXR</button>
  <button id="exitButton" style="display:none;" onclick="exitXR()">Sair do WebXR</button> <div id="instructions" style="position: absolute; top: 20px; right: 20px; color: white; background-color: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 5px; z-index: 1000; display: none;">Toque na tela para posicionar os modelos. Clique nos modelos para remover.</div>

  <script>
    let modeloParaInstanciar = 'modelo1'; // 'modelo1', 'modelo2', ou null quando terminar
    let reticle;
    let modelo1Cena, modelo2Cena; // Para armazenar as cenas completas
    let session = null;
    let modelosInstanciados = []; // Array para rastrear modelos instanciados para remoção
    let canvas, renderer, scene, camera;
    let raycaster; // Para seleção de objetos
    let mouse = new THREE.Vector2(); // Posição do mouse normalizada

    async function activateXR() {
      const startButton = document.querySelector('button');
      const exitButton = document.getElementById('exitButton');
      const instructions = document.getElementById('instructions');

      startButton.style.display = 'none';
      exitButton.style.display = 'block';
      instructions.style.display = 'block';

      canvas = document.createElement("canvas");
      document.body.appendChild(canvas);
      const gl = canvas.getContext("webgl", {xrCompatible: true});

      scene = new THREE.Scene();

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.3);
      directionalLight.position.set(10, 15, 10);
      scene.add(directionalLight);

      renderer = new THREE.WebGLRenderer({
        alpha: true,
        preserveDrawingBuffer: true,
        canvas: canvas,
        context: gl
      });
      renderer.autoClear = false;

      camera = new THREE.PerspectiveCamera();
      camera.matrixAutoUpdate = false;

      const loader = new THREE.GLTFLoader();

      // Carregar Modelo 1 (Cena Completa)
      loader.load("https://1000medic-marketing.github.io/ar/sino_s/SinoPower-S_triangulate_v2.glb", function(gltf) {
        modelo1Cena = gltf.scene; // Agora armazenamos a cena completa diretamente
      }, function ( xhr ) { /* ... */ }, function ( error ) { console.error("Erro ao carregar modelo1.glb", error); });

      // Carregar Modelo 2 (Cena Completa)
      loader.load("https://1000medic-marketing.github.io/ar/sino_d/SinoPower-D_triangulate.glb", function(gltf) {
        modelo2Cena = gltf.scene; // Também armazenamos a cena completa diretamente
      }, function ( xhr ) { /* ... */ }, function ( error ) { console.error("Erro ao carregar SinoPower-D_triangulate.glb", error); });

      // Carregar Retícula
      loader.load("https://immersive-web.github.io/webxr-samples/media/gltf/reticle/reticle.gltf", function(gltf) {
        reticle = gltf.scene;
        reticle.visible = false;
        scene.add(reticle);
      });

      session = await navigator.xr.requestSession("immersive-ar", {requiredFeatures: ['hit-test']});
      session.updateRenderState({
        baseLayer: new XRWebGLLayer(session, gl)
      });

      const referenceSpace = await session.requestReferenceSpace('local');
      const viewerSpace = await session.requestReferenceSpace('viewer');
      const hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

      raycaster = new THREE.Raycaster();

      session.addEventListener("select", (event) => {
        if (modeloParaInstanciar === 'modelo1') {
          if (modelo1Cena && reticle.visible) {
            const clone = modelo1Cena.clone(); // Clonamos a cena completa
            clone.position.copy(reticle.position);
            scene.add(clone);
            modelosInstanciados.push(clone);
            modeloParaInstanciar = 'modelo2';
            console.log("Modelo 1 instanciado. Próximo toque instancia Modelo 2.");
          }
        } else if (modeloParaInstanciar === 'modelo2') {
          if (modelo2Cena && reticle.visible) {
            const clone = modelo2Cena.clone(); // Clonamos a cena completa
            clone.position.copy(reticle.position);
            scene.add(clone);
            modelosInstanciados.push(clone);
            modeloParaInstanciar = null;
            reticle.visible = false;
            console.log("Modelo 2 instanciado. Instanciação completa.");
          }
        } else {
          console.log("Todos os modelos já foram instanciados.");
        }
      });

      canvas.addEventListener('click', onCanvasClick, false);
      canvas.addEventListener('touchstart', onCanvasClick, false);

      const onXRFrame = (time, frame) => {
        if (!session) return;

        session.requestAnimationFrame(onXRFrame);
        gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);

        const pose = frame.getViewerPose(referenceSpace);
        if (pose) {
          const view = pose.views[0];
          const viewport = session.renderState.baseLayer.getViewport(view);
          renderer.setSize(viewport.width, viewport.height);

          camera.matrix.fromArray(view.transform.matrix);
          camera.projectionMatrix.fromArray(view.projectionMatrix);
          camera.updateMatrixWorld(true);

          if (modeloParaInstanciar !== null) {
              const hitTestResults = frame.getHitTestResults(hitTestSource);
              if (hitTestResults.length > 0 && reticle) {
                  const hitPose = hitTestResults[0].getPose(referenceSpace);
                  reticle.visible = true;
                  reticle.position.set(hitPose.transform.position.x, hitPose.transform.position.y, hitPose.transform.position.z);
                  reticle.updateMatrixWorld(true);
              } else if (reticle) {
                  reticle.visible = false;
              }
          } else if (reticle) {
              reticle.visible = false;
          }

          renderer.render(scene, camera);
        }
      };

      session.requestAnimationFrame(onXRFrame);
    }

    function onCanvasClick(event) {
      if (!renderer || !camera || !scene || !modelosInstanciados.length) return;

      mouse.x = ( event.clientX / renderer.domElement.clientWidth ) * 2 - 1;
      mouse.y = - ( event.clientY / renderer.domElement.clientHeight ) * 2 + 1;

      raycaster.setFromCamera( mouse, camera );

      const intersects = raycaster.intersectObjects(modelosInstanciados, true);

      if (intersects.length > 0) {
        const objetoSelecionado = intersects[0].object.parent; // Pega o objeto pai (a cena clonada)

        scene.remove(objetoSelecionado);

        const index = modelosInstanciados.indexOf(objetoSelecionado);
        if (index > -1) {
          modelosInstanciados.splice(index, 1);
          console.log("Modelo removido.");
        }
      }
    }


    function exitXR() {
      if (session) {
        session.end();
        session = null;
      }

      const startButton = document.querySelector('button');
      const exitButton = document.getElementById('exitButton');
      const instructions = document.getElementById('instructions');

      startButton.style.display = 'block';
      exitButton.style.display = 'none';
      instructions.style.display = 'none';

      if (canvas && canvas.parentNode) {
        canvas.parentNode.removeChild(canvas);
        renderer.dispose();
        renderer = null;
        scene.dispose();
        scene = null;
        camera = null;
        modelosInstanciados = [];
        modeloParaInstanciar = 'modelo1';
        console.log("Sessão WebXR encerrada.");
      }
    }

  </script>
</body>
</html>
