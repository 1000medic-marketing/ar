<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>Experiência WebXR</title>

  <!-- Three.js and GLTFLoader -->
  <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
  <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .buttons { position: fixed; top: 10px; left: 10px; display: flex; flex-direction: column; }
    button { margin-bottom: 5px; padding: 10px; cursor: pointer; }
    #canvasContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
    #modelButtons { display: none; /* Initially hidden */ }
  </style>
</head>
<body>
  <div class="buttons">
    <button id="iniciarXRButton">Iniciar Experiência AR</button>
    <div id="modelButtons"> <button id="sinoPowerSButton" style="display: none;">SinoPower-S</button> <button id="sinoPowerDButton" style="display: none;">SinoPower-D</button> </div>
    <button id="resetButton">Resetar Experiência</button>
  </div>
  <div id="canvasContainer"><canvas id="xrCanvas" style="display: block;"></canvas></div>
  <script>
    let arSessionStarted = false; // Controla se a sessão AR foi iniciada
    let modeloParaInstanciar = null; // Modelo selecionado para instanciar
    let reticle;
    let sinoPowerSCena, sinoPowerDCena;
    let sinoPowerSInstanciado = false; // Controla se SinoPower-S já foi instanciado
    let sinoPowerDInstanciado = false; // Controla se SinoPower-D já foi instanciado
    const modelosInstanciados = []; // Array para rastrear modelos instanciados para reset

    async function activateXR() {
      arSessionStarted = true; // Define que a sessão AR foi iniciada
      document.getElementById('iniciarXRButton').style.display = 'none'; // Esconde o botão "Iniciar"
      document.getElementById('modelButtons').style.display = 'block'; // Mostra botões de seleção de modelo
      document.getElementById('sinoPowerSButton').style.display = 'block'; // Garante que botões de modelo apareçam
      document.getElementById('sinoPowerDButton').style.display = 'block'; // Garante que botões de modelo apareçam

      // Add canvas and initialize WebGL context
      const canvas = document.getElementById("xrCanvas");
      document.getElementById("canvasContainer").appendChild(canvas);
      const gl = canvas.getContext("webgl", {xrCompatible: true});

      // Set up the Three.js scene
      const scene = new THREE.Scene();
      scene.background = null;

      // Add directional light
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.3);
      directionalLight.position.set(10, 15, 10);
      scene.add(directionalLight);

      // Add ambient light
      const ambientLight = new THREE.AmbientLight(0x404040);
      scene.add(ambientLight);

      // Set up the WebGLRenderer
      const renderer = new THREE.WebGLRenderer({
        alpha: true,
        preserveDrawingBuffer: true,
        canvas: canvas,
        context: gl
      });
      renderer.autoClear = false;

      // Set up the camera
      const camera = new THREE.PerspectiveCamera();
      camera.matrixAutoUpdate = false;

      // Load GLTF models
      const loader = new THREE.GLTFLoader();

      // Carregar SinoPower-S
      loader.load("https://1000medic-marketing.github.io/ar/sino_s/SinoPower-S_triangulate_v2.glb", function(gltf) {
        sinoPowerSCena = gltf.scene;
        console.log("SinoPower-S carregado.");
      }, function ( xhr ) { /* ... */ }, function ( error ) { console.error("Erro ao carregar SinoPower-S", error); });

      // Carregar SinoPower-D
      loader.load("https://1000medic-marketing.github.io/ar/sino_d/SinoPower-D_triangulate.glb", function(gltf) {
        sinoPowerDCena = gltf.scene;
        console.log("SinoPower-D carregado.");
      }, function ( xhr ) { /* ... */ }, function ( error ) { console.error("Erro ao carregar SinoPower-D", error); });

      // Carregar Retícula
      loader.load("https://immersive-web.github.io/webxr-samples/media/gltf/reticle/reticle.gltf", function(gltf) {
        reticle = gltf.scene;
        reticle.visible = false;
        scene.add(reticle);
      });

      // Initialize a WebXR session
      const session = await navigator.xr.requestSession("immersive-ar", {requiredFeatures: ['hit-test']});
      session.updateRenderState({
        baseLayer: new XRWebGLLayer(session, gl)
      });

      const referenceSpace = await session.requestReferenceSpace('local');
      const viewerSpace = await session.requestReferenceSpace('viewer');
      const hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

      session.addEventListener("select", (event) => {
        if (modeloParaInstanciar === 'sino_s') {
          if (sinoPowerSCena && reticle.visible && !sinoPowerSInstanciado) { // Verifica se já não foi instanciado
            const clone = sinoPowerSCena.clone();
            clone.position.copy(reticle.position);
            scene.add(clone);
            modelosInstanciados.push(clone);
            sinoPowerSInstanciado = true; // Marca como instanciado
            modeloParaInstanciar = null;
            reticle.visible = false;
            console.log("SinoPower-S instanciado.");
          } else if (sinoPowerSInstanciado) {
            console.log("SinoPower-S já foi instanciado. Resetar para inserir novamente.");
          }
        } else if (modeloParaInstanciar === 'sino_d') {
          if (sinoPowerDCena && reticle.visible && !sinoPowerDInstanciado) { // Verifica se já não foi instanciado
            const clone = sinoPowerDCena.clone();
            clone.position.copy(reticle.position);
            scene.add(clone);
            modelosInstanciados.push(clone);
            sinoPowerDInstanciado = true; // Marca como instanciado
            modeloParaInstanciar = null;
            reticle.visible = false;
            console.log("SinoPower-D instanciado.");
          } else if (sinoPowerDInstanciado) {
            console.log("SinoPower-D já foi instanciado. Resetar para inserir novamente.");
          }
        }
      });

      // Render loop
      const onXRFrame = (time, frame) => {
        session.requestAnimationFrame(onXRFrame);
        gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);

        const pose = frame.getViewerPose(referenceSpace);
        if (pose) {
          const view = pose.views[0];
          const viewport = session.renderState.baseLayer.getViewport(view);
          renderer.setSize(viewport.width, viewport.height);

          camera.matrix.fromArray(view.transform.matrix);
          camera.projectionMatrix.fromArray(view.projectionMatrix);
          camera.updateMatrixWorld(true);

          if (modeloParaInstanciar !== null && arSessionStarted) { // Retícula só aparece se modelo selecionado E sessão AR iniciada
              const hitTestResults = frame.getHitTestResults(hitTestSource);
              if (hitTestResults.length > 0 && reticle) {
                  const hitPose = hitTestResults[0].getPose(referenceSpace);
                  reticle.visible = true;
                  reticle.position.set(hitPose.transform.position.x, hitPose.transform.position.y, hitPose.transform.position.z);
                  reticle.updateMatrixWorld(true);
              } else if (reticle) {
                  reticle.visible = false;
              }
          } else if (reticle) {
              reticle.visible = false; // Garante que a retícula fique escondida quando não deve aparecer
          }

          renderer.render(scene, camera);
        }
      };

      session.requestAnimationFrame(onXRFrame);
    }

    // Botão Iniciar Experiência AR
    document.getElementById('iniciarXRButton').addEventListener('click', () => {
        console.log("Botão 'Iniciar Experiência AR' clicado!"); // ADICIONE ESTA LINHA
        activateXR(); // Chama a função para iniciar WebXR
        document.getElementById('iniciarXRButton').style.display = 'none'; // Esconde o botão "Iniciar"
    });

    // Botões de Seleção de Modelo (agora visíveis APÓS iniciar AR)
    document.getElementById('sinoPowerSButton').addEventListener('click', () => {
      modeloParaInstanciar = 'sino_s';
      reticle.visible = true; // Mostrar retícula ao selecionar modelo
      console.log("Modelo SinoPower-S selecionado para instanciação.");
    });

    document.getElementById('sinoPowerDButton').addEventListener('click', () => {
      modeloParaInstanciar = 'sino_d';
      reticle.visible = true; // Mostrar retícula ao selecionar modelo
      console.log("Modelo SinoPower-D selecionado para instanciação.");
    });

    // Botão Resetar Experiência
    document.getElementById('resetButton').addEventListener('click', () => {
      modelosInstanciados.forEach(modelo => {
        scene.remove(modelo);
      });
      modelosInstanciados.length = 0;
      sinoPowerSInstanciado = false; // Permite instanciar SinoPower-S novamente
      sinoPowerDInstanciado = false; // Permite instanciar SinoPower-D novamente
      modeloParaInstanciar = null;
      reticle.visible = false; // Esconde a retícula ao resetar
      console.log("Experiência resetada.");
    });

  </script>
</body>
</html>
